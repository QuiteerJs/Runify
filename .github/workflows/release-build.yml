name: Release Build

# 可复用 workflow：在指定 tag 上做三平台矩阵打包，并把安装包上传到对应 Release。
# 由 release-please.yml 在「真正创建了 Release」时调用（tag_name 由调用方传入）。
# 也可通过 workflow_dispatch 手动触发（需提供 tag_name）。
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build from (e.g. v0.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifacts: |
              dist/out/*.dmg
              dist/out/*-mac.zip
          - os: windows-latest
            script: build:win
            artifacts: |
              dist/out/*.exe
          - os: ubuntu-latest
            script: build:linux
            artifacts: |
              dist/out/*.AppImage
              dist/out/*.deb
            apt-packages: libfuse2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system packages (Linux AppImage)
        if: ${{ runner.os == 'Linux' && matrix.apt-packages != '' }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Create .env.production (CI fallback)
        # electronup 0.2.5 的 getModeDev() 在 build 时强制读 .env.production。
        # 本地开发该文件存在但被 .gitignore 排除，CI 拿不到会直接报错退出。
        # 这里写入与本地一致的默认值（仅环境标识，无敏感信息）；
        # 真正需要覆盖的场景应通过 GH 仓库 secret 在上方 inject env。
        # 用 shell: bash 全平台统一（Windows runner 通过 Git Bash 跑）。
        run: |
          if [ ! -f .env.production ]; then
            echo 'VITE_MODE_TEXT=production' > .env.production
          fi
          echo "--- .env.production ---"
          cat .env.production
        shell: bash

      - name: Build installers
        run: pnpm run ${{ matrix.script }}
        env:
          # ⚠️ 必须清空 electron 镜像环境变量，否则 macOS 的 dmg 打包会 404。
          #
          # @electron/get 的 mirrorVar() 取 mirror 的优先级是：
          #   npm_config_electron_mirror  →  ELECTRON_MIRROR  →  代码传入的 mirrorOptions.mirror
          # 也就是**环境变量优先级高于调用方显式传入的 mirror**。
          # 而 electron-builder 下载 dmg 打包工具（dmgbuild-bundle-*.tar.gz）时，
          # 复用的正是同一个 @electron/get downloadArtifact():
          #   mirror = https://github.com/electron-userland/electron-builder-binaries/releases/download/
          #   dir    = dmg-builder@1.2.0
          # 项目 .npmrc 有 electron_mirror=https://cdn.npmmirror.com/binaries/electron/，
          # pnpm run 会把它导出成 npm_config_electron_mirror，于是 dmg 工具的 URL 变成
          #   https://cdn.npmmirror.com/binaries/electron/dmg-builder@1.2.0/dmgbuild-bundle-arm64-*.tar.gz
          # → 404，整个 build step 失败。
          #
          # 两者在 npmmirror 上的目录不同（/binaries/electron/ 与
          # /binaries/electron-builder-binaries/），共用一个变量无法同时满足，
          # 所以这里直接置空，让 electron 与 dmg-builder 都回落到官方 GitHub Release。
          # 置空后 falsy，mirrorVar 会继续往下走到代码传入的 mirror（正确值）。
          # GitHub-hosted runner 直连 github.com，比走境外镜像更稳。
          npm_config_electron_mirror: ''
          NPM_CONFIG_ELECTRON_MIRROR: ''
          ELECTRON_MIRROR: ''
          # ⚠️ 三道防线禁止 electron-builder 自动 publish（CI 里 404 必出）：
          # 1) CI: "false" → 让 ci-info 的 isCI 返回 false，绕开 electron-builder
          #    "Implicit publishing triggered by CI detection" 的自动 onTagOrDraft
          #    分支（这是 26.x 的硬编码行为，会覆盖 publish: null）。
          # 2) GITHUB_TOKEN / GH_TOKEN 置空 → 避免任何 GitHub publisher 尝试
          #    上传产物。
          # 3) GH_RELEASE_CREATE: "false" → 额外保险。
          # 产物上传统一交给下方 softprops/action-gh-release 走 PAT。
          CI: 'false'
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          GH_RELEASE_CREATE: 'false'

      - name: Upload installers to release
        if: ${{ inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: false
        env:
          # 与 release-please 一致：优先用 PAT，回退 GITHUB_TOKEN。
          # 组织若关闭了 workflow 写权限，GITHUB_TOKEN 可能不足以上传产物。
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
