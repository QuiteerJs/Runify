name: Release Build

# 可复用 workflow：在指定 tag 上做三平台矩阵打包，并把安装包上传到对应 Release。
# 由 release-please.yml 在「真正创建了 Release」时调用（tag_name 由调用方传入）。
# 也可通过 workflow_dispatch 手动触发（需提供 tag_name）。
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build from (e.g. v0.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifacts: |
              dist/out/*.dmg
              dist/out/*-mac.zip
          - os: windows-latest
            script: build:win
            artifacts: |
              dist/out/*.exe
          - os: ubuntu-latest
            script: build:linux
            artifacts: |
              dist/out/*.AppImage
              dist/out/*.deb
            apt-packages: libfuse2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system packages (Linux AppImage)
        if: ${{ runner.os == 'Linux' && matrix.apt-packages != '' }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Create .env.production (CI fallback)
        # electronup 0.2.5 的 getModeDev() 在 build 时强制读 .env.production。
        # 本地开发该文件存在但被 .gitignore 排除，CI 拿不到会直接报错退出。
        # 这里写入与本地一致的默认值（仅环境标识，无敏感信息）；
        # 真正需要覆盖的场景应通过 GH 仓库 secret 在上方 inject env。
        # 用 shell: bash 全平台统一（Windows runner 通过 Git Bash 跑）。
        run: |
          if [ ! -f .env.production ]; then
            echo 'VITE_MODE_TEXT=production' > .env.production
          fi
          echo "--- .env.production ---"
          cat .env.production
        shell: bash

      - name: Build installers
        run: pnpm run ${{ matrix.script }}
        env:
          # 用官方 registry，避免镜像破坏 provenance 导致依赖校验失败
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          # ⚠️ 不要给 electron-builder 任何 GitHub token（包括 GITHUB_TOKEN，
          # 因为 GitHub Actions 会默认把 GITHUB_TOKEN 注入到每个 step 的 env）。
          # 一旦它检测到任何 GH* / GITHUB* token，就会自动走 GitHub publisher
          # 上传产物（owner/repo/version 三元组匹配），撞组织 PR 写权限
          # 禁用返回 HTTPError 404 并把整个 build step 拉成失败。
          # 产物上传统一交给下方 softprops/action-gh-release 走 PAT。
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          GH_RELEASE_CREATE: 'false'

      - name: Upload installers to release
        if: ${{ inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: false
        env:
          # 与 release-please 一致：优先用 PAT，回退 GITHUB_TOKEN。
          # 组织若关闭了 workflow 写权限，GITHUB_TOKEN 可能不足以上传产物。
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
