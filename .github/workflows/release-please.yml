name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # 优先用 RELEASE_PLEASE_TOKEN（PAT），没有则回退到 GITHUB_TOKEN。
          # 为什么需要 PAT：本仓库所属组织默认关闭了 workflow 的写权限
          # （can_approve_pull_request_reviews=false），GITHUB_TOKEN 会报
          # "GitHub Actions is not permitted to create or approve pull requests"。
          # 两种解法二选一：
          #   1) 组织设置开启：Settings → Actions → General → Workflow permissions
          #      → 勾选 "Allow GitHub Actions to create and approve pull requests"
          #   2) 配置一个 classic PAT（勾选 repo 全选即可）存为仓库 secret
          #      RELEASE_PLEASE_TOKEN，此时无需改组织设置。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # GITHUB_TOKEN 创建的 tag 不会触发第二次 workflow 运行，
  # 所以当 release-please 真正创建了 Release 时，这里直接调用可复用的构建 workflow。
  build-and-upload:
    name: Build & upload installers
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
