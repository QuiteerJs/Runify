shellEmulator: true

# https://pnpm.io/settings/dependency-resolution#trustpolicy
# 供应链策略：包若曾以更强信任证据（如 provenance 签名）发布，后续版本不得降级
trustPolicy: no-downgrade

# https://pnpm.io/settings/dependency-resolution#trustpolicyexclude
# 豁免：以下 4 个长期锁定使用的老版本缺少 provenance 签名，被 no-downgrade 策略
# 误判为 "possible package takeover"（High-risk trust downgrade）。
# 判定依据是发布时间与信任证据，而非实际内容——这些版本本身未被劫持，
# 只是早于签名机制普及。按官方做法精确豁免，保留对其余包的检查。
# 若日后升级这些依赖到受信任版本，可将对应条目移除。
trustPolicyExclude:
  - chokidar@4.0.3
  - rollup@3.30.0
  - semver@5.7.2
  - semver@6.3.1

# pnpm v10 配置：允许以下依赖执行 postinstall / build 脚本
# pnpm v10 起不再读取 package.json 的 pnpm.onlyBuiltDependencies，需迁移到本文件
# 参考 https://pnpm.io/zh/settings#onlybuiltdependencies
onlyBuiltDependencies:
  - electron
  - esbuild
  - simple-git-hooks
  - vue-demi

# https://pnpm.io/settings#onlybuiltdependencies
# pnpm 逐包记录「是否允许执行构建脚本」的决定，与上面的 onlyBuiltDependencies 保持一致。
# 注意：这一段的取值必须是明确的 true / false。若留成 pnpm 自动生成的占位符
# "set this to true or false"，pnpm 每次 install 都会判定配置未决而重写本文件，
# 使 pnpm-workspace.yaml 的 mtime 晚于 node_modules/.modules.yaml，
# 于是下次 `pnpm run` 的依赖检查又认为 node_modules 过期，
# 反复弹出 "modules directory will be removed and reinstalled from scratch"。
allowBuilds:
  # 必须构建：postinstall 负责下载/解压各平台预编译二进制
  electron: true
  # 当前依赖树未安装（Windows 打包 / 独立 node 运行时相关），保持关闭
  electron-winstaller: false
  esbuild: true
  node: false
  # git hooks 与 vue 版本切换的 postinstall
  simple-git-hooks: true
  vue-demi: true
